[project]
name = "ai-investment-decision-support"
version = "0.1.0"
description = "Local-first AI investment decision support platform scaffold."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "ipykernel>=6.29.0",
    "nbformat>=5.10.0",
    "pandas>=2.2.0",
    "pydantic>=2.10.0",
    "yfinance>=0.2.65",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
